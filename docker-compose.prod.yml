services:
  # MongoDB 数据库
  mongodb:
    image: mongo:7
    container_name: minichat-mongo
    restart: always
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-changeme}
    networks:
      - minichat-network

  # Redis 缓存
  redis:
    image: redis:alpine
    container_name: minichat-redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - minichat-network

  # PostgreSQL + pgvector（知识库）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: minichat-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-minichat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - minichat-network

  # 后端 API (从 Docker Hub 拉取)
  backend:
    image: ${DOCKERHUB_USERNAME}/minichat-backend:latest
    container_name: minichat-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-changeme}@mongodb:27017/mini-chat?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-minichat}
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - AI_EMBEDDING_BASE_URL=${AI_EMBEDDING_BASE_URL}
      - AI_EMBEDDING_API_KEY=${AI_EMBEDDING_API_KEY}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL}
      - AI_EMBEDDING_DIMENSIONS=${AI_EMBEDDING_DIMENSIONS}
    depends_on:
      - mongodb
      - redis
      - postgres
    networks:
      - minichat-network

  # 前端 (从 Docker Hub 拉取)
  frontend:
    image: ${DOCKERHUB_USERNAME}/minichat-frontend:latest
    container_name: minichat-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - minichat-network

networks:
  minichat-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  postgres_data:
