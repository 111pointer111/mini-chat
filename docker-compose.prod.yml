services:
  # MongoDB 数据库
  mongodb:
    image: mongo:7
    container_name: minichat-mongo
    restart: always
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minichat-network

  # Redis 缓存
  redis:
    image: redis:alpine
    container_name: minichat-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minichat-network

  # PostgreSQL + pgvector（知识库）
  postgres:
    image: pgvector/pgvector:pg16
    container_name: minichat-postgres
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-minichat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minichat-network

  # 后端 API (从 Docker Hub 拉取)
  backend:
    image: ${DOCKERHUB_USERNAME}/minichat-backend:latest
    container_name: minichat-backend
    restart: always
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-changeme}@mongodb:27017/mini-chat?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-minichat}
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE}
      - ALIYUN_SMTP_HOST=${ALIYUN_SMTP_HOST}
      - ALIYUN_SMTP_PORT=${ALIYUN_SMTP_PORT}
      - ALIYUN_SMTP_USER=${ALIYUN_SMTP_USER}
      - ALIYUN_SMTP_PASS=${ALIYUN_SMTP_PASS}
      - ALIYUN_SMTP_SENDER_NAME=${ALIYUN_SMTP_SENDER_NAME}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - AI_EMBEDDING_BASE_URL=${AI_EMBEDDING_BASE_URL}
      - AI_EMBEDDING_API_KEY=${AI_EMBEDDING_API_KEY}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL}
      - AI_EMBEDDING_DIMENSIONS=${AI_EMBEDDING_DIMENSIONS}
      - ALERT_EMAIL=${ALERT_EMAIL}
      - ALERT_MIN_SEVERITY=${ALERT_MIN_SEVERITY:-warning}
      - ALERT_ERROR_RATE_PERCENT=${ALERT_ERROR_RATE_PERCENT:-2}
      - ALERT_ERROR_RATE_MIN_REQUESTS=${ALERT_ERROR_RATE_MIN_REQUESTS:-20}
      - ALERT_SERVICE_DOWN_MIN_REQUESTS=${ALERT_SERVICE_DOWN_MIN_REQUESTS:-5}
      - ALERT_LATENCY_P95_MS=${ALERT_LATENCY_P95_MS:-800}
      - ALERT_LATENCY_MIN_SAMPLES=${ALERT_LATENCY_MIN_SAMPLES:-30}
      - ALERT_MEMORY_MB=${ALERT_MEMORY_MB:-350}
      - ALERT_EVENT_LOOP_LAG_MS=${ALERT_EVENT_LOOP_LAG_MS:-200}
      - ALERT_COOLDOWN_MS=${ALERT_COOLDOWN_MS:-300000}
      - ENABLE_MONITORING_TEST_ROUTES=${ENABLE_MONITORING_TEST_ROUTES:-false}
      - MONITORING_TEST_TOKEN=${MONITORING_TEST_TOKEN}
      - CORS_ORIGINS=${CORS_ORIGINS}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - minichat-network

  # 后端 Worker（定时任务调度与执行）
  worker:
    image: ${DOCKERHUB_USERNAME}/minichat-backend:latest
    container_name: minichat-worker
    restart: always
    command: npm run start:worker
    volumes:
      - uploads_data:/app/uploads
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-changeme}@mongodb:27017/mini-chat?authSource=admin
      - JWT_SECRET=${JWT_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-minichat}
      - ALIYUN_ACCESS_KEY_ID=${ALIYUN_ACCESS_KEY_ID}
      - ALIYUN_ACCESS_KEY_SECRET=${ALIYUN_ACCESS_KEY_SECRET}
      - ALIYUN_SMS_SIGN_NAME=${ALIYUN_SMS_SIGN_NAME}
      - ALIYUN_SMS_TEMPLATE_CODE=${ALIYUN_SMS_TEMPLATE_CODE}
      - ALIYUN_SMTP_HOST=${ALIYUN_SMTP_HOST}
      - ALIYUN_SMTP_PORT=${ALIYUN_SMTP_PORT}
      - ALIYUN_SMTP_USER=${ALIYUN_SMTP_USER}
      - ALIYUN_SMTP_PASS=${ALIYUN_SMTP_PASS}
      - ALIYUN_SMTP_SENDER_NAME=${ALIYUN_SMTP_SENDER_NAME}
      - AI_BASE_URL=${AI_BASE_URL}
      - AI_API_KEY=${AI_API_KEY}
      - AI_MODEL=${AI_MODEL}
      - AI_EMBEDDING_BASE_URL=${AI_EMBEDDING_BASE_URL}
      - AI_EMBEDDING_API_KEY=${AI_EMBEDDING_API_KEY}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL}
      - AI_EMBEDDING_DIMENSIONS=${AI_EMBEDDING_DIMENSIONS}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - minichat-network

  # 前端 (从 Docker Hub 拉取)
  frontend:
    image: ${DOCKERHUB_USERNAME}/minichat-frontend:latest
    container_name: minichat-frontend
    restart: always
    ports:
      - "8080:80"
    volumes:
      - /opt/minichat/downloads:/usr/share/nginx/html/downloads:ro
    depends_on:
      - backend
    networks:
      - minichat-network

networks:
  minichat-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  postgres_data:
  uploads_data:
