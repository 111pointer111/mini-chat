services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minichat-network

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minichat-network

  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=minichat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - minichat-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5001:5000"
    volumes:
      - uploads_data:/app/uploads
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/mini-chat?authSource=admin
      - JWT_SECRET=dev_secret_key
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=minichat
      - ALIYUN_ACCESS_KEY_ID=
      - ALIYUN_ACCESS_KEY_SECRET=
      - ALIYUN_SMS_SIGN_NAME=
      - ALIYUN_SMS_TEMPLATE_CODE=
      - AI_BASE_URL=
      - AI_API_KEY=
      - AI_MODEL=
      - AI_EMBEDDING_BASE_URL=
      - AI_EMBEDDING_API_KEY=
      - AI_EMBEDDING_MODEL=
      - AI_EMBEDDING_DIMENSIONS=
      - ALERT_MIN_SEVERITY=info
      - ENABLE_MONITORING_TEST_ROUTES=true
      - MONITORING_TEST_TOKEN=dev-monitoring-test
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - minichat-network

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: npm run start:worker
    volumes:
      - uploads_data:/app/uploads
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://admin:password@mongodb:27017/mini-chat?authSource=admin
      - JWT_SECRET=dev_secret_key
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=minichat
      - ALIYUN_ACCESS_KEY_ID=
      - ALIYUN_ACCESS_KEY_SECRET=
      - ALIYUN_SMS_SIGN_NAME=
      - ALIYUN_SMS_TEMPLATE_CODE=
      - AI_BASE_URL=
      - AI_API_KEY=
      - AI_MODEL=
      - AI_EMBEDDING_BASE_URL=
      - AI_EMBEDDING_API_KEY=
      - AI_EMBEDDING_MODEL=
      - AI_EMBEDDING_DIMENSIONS=
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - minichat-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - minichat-network

volumes:
  mongodb_data:
  redis_data:
  postgres_data:
  uploads_data:

networks:
  minichat-network:
    driver: bridge
