name: CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/minichat-backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/minichat-frontend:latest

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/minichat/"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/minichat
            # Update env vars in .env.production (always update to latest values)
            sed -i '/^DOCKERHUB_USERNAME=/d' .env.production 2>/dev/null || true
            sed -i '/^MONGO_USER=/d' .env.production 2>/dev/null || true
            sed -i '/^MONGO_PASSWORD=/d' .env.production 2>/dev/null || true
            sed -i '/^JWT_SECRET=/d' .env.production 2>/dev/null || true
            sed -i '/^AI_BASE_URL=/d' .env.production 2>/dev/null || true
            sed -i '/^AI_API_KEY=/d' .env.production 2>/dev/null || true
            sed -i '/^AI_MODEL=/d' .env.production 2>/dev/null || true
            sed -i '/^ALIYUN_ACCESS_KEY_ID=/d' .env.production 2>/dev/null || true
            sed -i '/^ALIYUN_ACCESS_KEY_SECRET=/d' .env.production 2>/dev/null || true
            sed -i '/^ALIYUN_SMS_SIGN_NAME=/d' .env.production 2>/dev/null || true
            sed -i '/^ALIYUN_SMS_TEMPLATE_CODE=/d' .env.production 2>/dev/null || true
            sed -i '/^ALIYUN_SMTP_HOST=/d' .env.production 2>/dev/null || true
            sed -i '/^ALIYUN_SMTP_PORT=/d' .env.production 2>/dev/null || true
            sed -i '/^ALIYUN_SMTP_USER=/d' .env.production 2>/dev/null || true
            sed -i '/^ALIYUN_SMTP_PASS=/d' .env.production 2>/dev/null || true
            sed -i '/^ALIYUN_SMTP_SENDER_NAME=/d' .env.production 2>/dev/null || true
            echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env.production
            echo "MONGO_USER=${{ secrets.MONGO_USER || 'admin' }}" >> .env.production
            echo "MONGO_PASSWORD=${{ secrets.MONGO_PASSWORD }}" >> .env.production
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> .env.production
            echo "AI_BASE_URL=${{ secrets.AI_BASE_URL }}" >> .env.production
            echo "AI_API_KEY=${{ secrets.AI_API_KEY }}" >> .env.production
            echo "AI_MODEL=${{ secrets.AI_MODEL || 'gpt-4' }}" >> .env.production
            echo "ALIYUN_ACCESS_KEY_ID=${{ secrets.ALIYUN_ACCESS_KEY_ID }}" >> .env.production
            echo "ALIYUN_ACCESS_KEY_SECRET=${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}" >> .env.production
            echo "ALIYUN_SMS_SIGN_NAME=${{ secrets.ALIYUN_SMS_SIGN_NAME }}" >> .env.production
            echo "ALIYUN_SMS_TEMPLATE_CODE=${{ secrets.ALIYUN_SMS_TEMPLATE_CODE }}" >> .env.production
            echo "ALIYUN_SMTP_HOST=smtpdm.aliyun.com" >> .env.production
            echo "ALIYUN_SMTP_PORT=465" >> .env.production
            echo "ALIYUN_SMTP_USER=verify@mini-chat.cn" >> .env.production
            echo "ALIYUN_SMTP_PASS=${{ secrets.ALIYUN_SMTP_PASS }}" >> .env.production
            echo "ALIYUN_SMTP_SENDER_NAME=微聊天智能助手" >> .env.production
            docker compose -f docker-compose.prod.yml --env-file .env.production pull
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --force-recreate
            docker image prune -f
            echo "Deployment completed at $(date)"
