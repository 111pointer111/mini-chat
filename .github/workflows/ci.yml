name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一 PR 新 push 时自动取消旧的运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==================== Backend 检查 ====================
  backend-check:
    name: Backend / Type Check
    runs-on: ubuntu-latest
    # 只在 backend 相关文件变更时运行
    # 注意：push to main 时没有 paths 过滤（始终运行）
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      - name: TypeScript type check
        working-directory: backend
        run: npm run typecheck

  # ==================== Frontend 检查 ====================
  frontend-check:
    name: Frontend / Lint + Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc -b

      - name: ESLint
        working-directory: frontend
        run: npm run lint

  # ==================== 测试 ====================
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Run tests
        run: node --test tests/*.test.js

      - name: Run evals
        run: node --test evals/*.eval.js

  # ==================== Docker 构建检查 ====================
  docker-check:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [backend-check, frontend-check, test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build backend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: false
          tags: minichat-backend:ci-test

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: false
          tags: minichat-frontend:ci-test
