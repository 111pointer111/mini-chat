name: bolt_chat
description: "BoltChat - AI Messenger"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP client
  dio: ^5.4.0

  # Socket.IO
  socket_io_client: ^2.0.3+1

  # Routing
  go_router: ^14.2.0

  # Local storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.2.8
  path: ^1.8.0

  # UI
  cached_network_image: ^3.3.1
  flutter_markdown: ^0.6.18
  image_picker: ^1.0.7
  file_picker: ^6.1.1
  google_fonts: ^6.2.1

  # Utils
  intl: ^0.19.0
  uuid: ^4.2.1

  cupertino_icons: ^1.0.8
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/bolt_icon_002.jpg"
  adaptive_icon_background: "#6366f1"
  adaptive_icon_foreground: "assets/icons/bolt_icon_002.jpg"

flutter:
  uses-material-design: true
