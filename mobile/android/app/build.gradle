plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def requiredKeystoreKeys = ["storePassword", "keyPassword", "keyAlias", "storeFile"]
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.minichat.mobile"
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.minichat.mobile"
        minSdk = 21
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = rootProject.file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
        }
    }
}

tasks.matching { it.name == "validateSigningRelease" }.configureEach {
    doFirst {
        if (!keystorePropertiesFile.exists()) {
            throw new GradleException("Missing android/key.properties for release signing")
        }

        def missingKeys = requiredKeystoreKeys.findAll { !keystoreProperties[it] }
        if (!missingKeys.isEmpty()) {
            throw new GradleException("Missing release signing values: ${missingKeys.join(', ')}")
        }
    }
}

dependencies {
    implementation "androidx.core:core-ktx:1.13.1"
}

flutter {
    source = "../.."
}
